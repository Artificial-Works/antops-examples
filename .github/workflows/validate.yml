name: Validate examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Generate and validate Postman artifacts
        run: |
          node scripts/generate-postman.mjs
          jq empty postman/*.json
      - name: Check example syntax
        run: |
          node --check javascript/examples.mjs
          node --check javascript/recurring-products.mjs
          npm exec -- tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext typescript/examples.ts
          npm exec -- tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext typescript/recurring-products.ts
          python -m py_compile python/examples.py
          python -m py_compile python/recurring_products.py webhooks/verify.py
          bash -n curl/*.sh
          test -s developer-tools/README.md
