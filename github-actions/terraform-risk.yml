name: Terraform risk signal

on:
  pull_request:
    paths: ["**.tf", "**.tfvars"]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Prepare plan JSON
        run: |
          terraform init -backend=false
          terraform plan -out=tfplan
          terraform show -json tfplan > tfplan.json
      - name: Call AntOps
        env:
          ANTOPS_RAPIDAPI_KEY: ${{ secrets.ANTOPS_RAPIDAPI_KEY }}
        run: |
          jq -n --rawfile content tfplan.json '{analysis_type:"plan_json", content:$content}' > request.json
          curl --fail-with-body -sS -X POST https://artificial-works-risk-apis.p.rapidapi.com/v1/terraform-risk/analyze \
            -H "X-RapidAPI-Key: $ANTOPS_RAPIDAPI_KEY" -H "X-RapidAPI-Host: artificial-works-risk-apis.p.rapidapi.com" -H "Content-Type: application/json" \
            --data @request.json > antops-result.json
          jq . antops-result.json
      - name: Fail on critical findings
        run: test "$(jq '.summary.critical // 0' antops-result.json)" -eq 0
